services:
  api:
    build: ../Synthoria LLM
    ports:
      - "8000:8000"
    env_file:
    - .env
    environment:
      PYTHONUNBUFFERED: 1
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_PERSIST_DIRECTORY: /data/chroma
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://synthoria:synthoria@postgres:5432/synthoria
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      HF_VIDEO_MODEL_PRIMARY: ${HF_VIDEO_MODEL_PRIMARY:-LTX-Video}
      HF_VIDEO_MODEL_FALLBACK: ${HF_VIDEO_MODEL_FALLBACK:-LTX-Video}
      VIDEO_STORAGE_PATH: /data/videos
    depends_on:
      ollama:
        condition: service_healthy
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - chroma-data:/data
      - video-data:/data/videos
    networks:
      - default
      - synthoria-net   # ajouté : accessible depuis Studio

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    environment:
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    command: ["serve"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Décommenter pour GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #         count: all
    #         capabilities: [gpu]
    
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull ${OLLAMA_DEFAULT_MODEL:-llama3.2} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    environment:
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ollama-data:/root/.ollama

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthoria}
      POSTGRES_DB: ${POSTGRES_DB:-synthoria}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synthoria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    
networks:
  default:
  synthoria-net:
    external: true

volumes:
  ollama-data:
  chroma-data:
  postgres-data:
  video-data: