services:
  api:
    build: ../Synthoria LLM
    ports:
      - "8000:8000"
    env_file:
    - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      PYTHONUNBUFFERED: 1
      OLLAMA_BASE_URL: http://ollama:11435
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_PERSIST_DIRECTORY: /data/chroma
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://synthoria:synthoria@postgres:5432/synthoria
    depends_on:
      ollama:
        condition: service_healthy
      chroma:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - chroma-data:/data
      - podcast-data:/data/podcasts   # partagé avec le worker : l'API sert les MP3 produits par lui
    networks:
      - default
      - synthoria-net   # ajouté : accessible depuis Studio

  worker:
    build: ../Synthoria LLM
    command: ["python", "-m", "app.workers.podcast_worker"]
    env_file:
    - .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      PYTHONUNBUFFERED: 1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: postgresql+asyncpg://synthoria:synthoria@postgres:5432/synthoria
      PODCAST_TTS_BASE_URL: http://piper:5000
      PODCAST_STORAGE_DIR: /data/podcasts
    depends_on:
      postgres:
        condition: service_healthy
      piper:
        condition: service_healthy
    cpus: 1.5   # borne le CPU de la synthèse vocale pour préserver l'API
    restart: unless-stopped
    stop_grace_period: 60s   # laisse le worker finir son étape sur SIGTERM
    volumes:
      - podcast-data:/data/podcasts
    networks:
      - default

  piper:
    build:
      context: .
      dockerfile: docker/piper/Dockerfile
    environment:
      PIPER_DEFAULT_VOICE: ${PODCAST_VOICE_HOST:-fr_FR-siwis-medium}
    # Aucun port publié : joignable uniquement depuis le réseau interne (api / worker).
    expose:
      - "5000"
    depends_on:
      piper-init:
        condition: service_completed_successfully
    volumes:
      - piper-voices:/voices
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5000), 2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  piper-init:
    build:
      context: .
      dockerfile: docker/piper/Dockerfile
    # Télécharge les voix FR (une femme, un homme) : vérifier la licence (MODEL_CARD) de chaque voix avant usage.
    command: ["download", "${PODCAST_VOICE_HOST:-fr_FR-siwis-medium}", "${PODCAST_VOICE_EXPERT:-fr_FR-tom-medium}"]
    volumes:
      - piper-voices:/voices

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11435"
    environment:
      OLLAMA_HOST: 0.0.0.0:11435   # sinon Ollama écoute sur 11434 et l'API (11435) est injoignable
      OLLAMA_DEFAULT_MODEL: ${OLLAMA_DEFAULT_MODEL:-llama3.2}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    command: ["serve"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # Décommenter pour GPU NVIDIA :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #         count: all
    #         capabilities: [gpu]
    
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama pull ${OLLAMA_DEFAULT_MODEL:-llama3.2} &&
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    environment:
      OLLAMA_HOST: http://ollama:11435
    volumes:
      - ollama-data:/root/.ollama

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synthoria}
      POSTGRES_DB: ${POSTGRES_DB:-synthoria}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synthoria}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    restart: unless-stopped
    
networks:
  default:
  synthoria-net:
    external: true

volumes:
  ollama-data:
  chroma-data:
  postgres-data:
  piper-voices:
  podcast-data: